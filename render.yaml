services:
  - type: web
    name: zyrov
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run start:api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: DATA_DIR
        value: /var/data
      - key: EMAIL_WEBHOOK_URL
        sync: false
    disk:
      name: zyrov-data
      mountPath: /var/data
      sizeGB: 1